<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ダイエット記録</title>
<style>
:root{
  --pink:#f7c6d2; --pink-deep:#e0607e; --pink-bg:#fdeef2;
  --blue:#5b8def; --blue-bg:#eaf1fd;
  --cream:#fffdf6; --line:#e5e0dc; --text:#3a3330; --muted:#8d8480;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:#faf7f4;color:var(--text);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-family:"Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;}
/* 16:9 の画面いっぱいに収まるステージ */
#stage{width:1600px;height:900px;flex:none;padding:26px 30px;transform-origin:center center;}
.page{display:none;height:100%;}
.page.active{display:block;}
button{font-family:inherit;font-size:15px;color:var(--text);background:#fff;
  border:1px solid var(--pink);border-radius:12px;padding:10px 18px;cursor:pointer;}
button:hover{background:#faf7f4;}
button.pink{background:var(--pink-bg);border-color:var(--pink);color:#a83f5c;}
button.pink:hover{background:#fbe0e8;}
button.blue{background:var(--blue-bg);border-color:#c5d8fb;color:#2f5cb0;}
button.small{font-size:13px;padding:6px 12px;border-radius:9px;}
input[type=text],input[type=number]{font-family:inherit;font-size:16px;color:var(--text);
  border:1px solid var(--pink);border-radius:9px;padding:8px 10px;background:#fff;width:100%;}
input:focus{outline:2px solid var(--pink);outline-offset:0;border-color:var(--pink);}
.hidden-file{display:none;}
.card{background:#fff;border:none;border-radius:18px;padding:16px 18px;}
.center{text-align:center;}
.sub{font-size:15px;color:var(--muted);}
.mt8{margin-top:8px;} .mt14{margin-top:14px;}

/* 画像の中に入れる「画像を変更する」ボタン */
.imgwrap{position:relative;}
.overbtn{position:absolute;right:16px;bottom:12px;
  background:rgba(253,238,242,.94);border:1px solid var(--pink);color:#a83f5c;
  font-size:11px;padding:3px 9px;border-radius:12px;z-index:2;white-space:nowrap;line-height:1.4;}
.overbtn:hover{background:#fbe0e8;}

/* ===== ホーム ===== */
.home-grid{display:grid;grid-template-rows:384px 1fr 66px;gap:18px;height:100%;}
.top{display:grid;grid-template-columns:404px minmax(0,1fr);gap:24px;align-items:center;}
.topinfo{text-align:center;}
.icon-box{width:384px;height:384px;border-radius:50%;border:10px solid var(--pink);
  background:var(--pink-bg);overflow:hidden;display:flex;align-items:center;justify-content:center;}
.icon-box img{width:100%;height:100%;object-fit:cover;}
.icon-ph{color:#c99aa8;font-size:30px;font-weight:700;text-align:center;line-height:1.6;}
.goal-line{font-size:56px;font-weight:700;line-height:1.1;}
.goal-line .num{color:var(--pink-deep);}
.goal-line .kg{font-size:40px;}
.remain{font-size:80px;font-weight:700;line-height:1;margin-top:4px;}
.remain .num{font-size:180px;color:var(--pink-deep);letter-spacing:-5px;}
.remain .kg{font-size:100px;}
.mid{display:grid;grid-template-columns:404px minmax(0,1fr) minmax(0,1fr);gap:18px;min-height:0;}
.graph{width:100%;height:auto;}
.gline{stroke:var(--blue);stroke-width:2.5;fill:none;}
.gdot{fill:var(--blue);}
.glast{fill:var(--pink-deep);}
.ggrid{stroke:#eeeeee;stroke-width:1;}
.glabel{font-size:12px;fill:var(--muted);}
.free-box{width:100%;height:100%;border:none;border-radius:28px;
  background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.free-box img{width:100%;height:100%;object-fit:cover;}
.free-ph{color:#8d8480;font-size:30px;font-weight:700;}
.cal-wrap{border:none;border-radius:28px;background:#fff;
  padding:12px 16px;height:100%;display:flex;flex-direction:column;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.cal-head .m{font-size:22px;font-weight:700;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;flex:1;}
.cal .w{font-size:14px;color:var(--muted);}
.cal .w.sun{color:var(--pink-deep);}
.cal .d{border-radius:10px;font-size:17px;cursor:pointer;border:1px solid transparent;
  display:flex;align-items:center;justify-content:center;}
.cal .d:hover{background:var(--pink-bg);}
.cal .d.sun{color:var(--pink-deep);}
.cal .d.has{background:var(--pink-bg);border-color:var(--pink);font-weight:700;}
.cal .d.today{outline:2px solid var(--pink-deep);}
.cal .d.empty{cursor:default;}
.btnrow{display:flex;gap:18px;justify-content:center;align-items:center;}
.btnrow button{font-size:18px;padding:13px 26px;}

/* ===== 記入ページ ===== */
h1{font-size:30px;font-weight:700;margin:0 0 16px;display:flex;align-items:center;justify-content:center;gap:12px;}
h1 .dot{width:14px;height:14px;border-radius:50%;background:var(--pink-deep);}
.entry{display:grid;grid-template-columns:minmax(0,1fr) 600px;gap:26px;align-items:start;height:770px;}
.mealcard{background:#fff;border-radius:18px;padding:20px 24px;height:100%;display:flex;flex-direction:column;}
.wcell{background:var(--cream);border:none;border-radius:14px;padding:12px;text-align:center;}
.wcell .lb{font-size:17px;color:#a08c5c;margin-bottom:8px;}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
table.meal{width:100%;border-collapse:collapse;}
table.meal th{font-size:15px;color:var(--muted);font-weight:500;padding:4px 6px;text-align:left;}
table.meal td{padding:7px 6px;}
table.meal td.k{width:170px;} table.meal td.u{width:52px;font-size:16px;color:var(--muted);} table.meal td.x{width:44px;}
input.uline{border:none;border-bottom:2px solid var(--pink);border-radius:0;background:transparent;
  font-size:18px;padding:5px 4px;width:100%;}
input.uline:focus{outline:none;border-bottom:2px solid var(--pink-deep);background:#fdf7f9;}
.mkcal{text-align:right;}
.total{display:flex;align-items:center;justify-content:space-between;
  background:var(--pink-bg);border-radius:14px;padding:16px 22px;font-size:21px;margin-top:auto;}
.total .num{font-size:34px;font-weight:700;color:var(--pink-deep);}
.fight-box{width:100%;height:360px;border:none;border-radius:24px;
  background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.fight-box img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;}
.list-tbl{width:100%;border-collapse:collapse;font-size:16px;}
.list-tbl th,.list-tbl td{border-bottom:1px solid var(--pink-bg);padding:10px 12px;text-align:left;}
.list-tbl th{font-size:14px;color:var(--muted);font-weight:500;}

/* ===== 応援キャラ ===== */
.waving.imgwave{animation:tilt .6s ease-in-out 5;transform-origin:50% 90%;}
@keyframes tilt{0%{transform:rotate(0deg)}30%{transform:rotate(-9deg)}60%{transform:rotate(9deg)}100%{transform:rotate(0deg)}}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(255,255,255,.75);z-index:60;}
.modal.show{display:flex;}
.modal-in{background:#fff;border:4px solid var(--pink);border-radius:26px;padding:30px 40px;text-align:center;}
.modal-in .ttl{font-size:26px;font-weight:700;margin-bottom:16px;}
.modal-in input{font-size:34px;text-align:center;width:220px;border:none;border-bottom:3px solid var(--pink);
  border-radius:0;padding:6px 4px;}
.modal-in input:focus{outline:none;border-bottom-color:var(--pink-deep);}
.modal-in .unit{font-size:26px;font-weight:700;margin-left:8px;}
.modal-in .row{display:flex;gap:14px;justify-content:center;margin-top:22px;}
.modal-in .err{color:var(--pink-deep);font-size:15px;height:20px;margin-top:8px;}
.cheer{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(255,255,255,.75);z-index:50;}
.cheer.show{display:flex;}
.cheer-in{background:#fff;border:5px solid var(--pink);border-radius:30px;padding:26px 52px;text-align:center;}
.cheer-in img{max-width:280px;max-height:340px;}
.cheer-in .msg{font-size:44px;font-weight:700;color:var(--pink-deep);margin-top:8px;}
</style>
</head>
<body>


<div id="stage">

<!-- ============ ホーム ============ -->
<div id="pageHome" class="page active">
  <div class="home-grid">

    <div class="top">
      <div class="imgwrap" style="width:384px;height:384px;">
        <div class="icon-box" id="iconBox"><div class="icon-ph">アイコン<br>画像</div></div>
        <button class="overbtn" id="btnIcon" style="right:76px;bottom:28px;">変更</button>
      </div>
      <div class="topinfo">
        <div class="goal-line">目標 <span class="num" id="goalTxt">○○</span><span class="kg">kg まで</span></div>
        <button class="small mt8" id="btnGoal">目標を変更する</button>
        <div class="remain">あと <span class="num" id="remainTxt">○○</span><span class="kg">kg</span></div>
        <div class="sub" id="lastTxt">まだ記録がありません</div>
      </div>
    </div>

    <div class="mid">
      <div class="cal-wrap">
        <div class="cal-head">
          <button class="small" id="prevM">&lsaquo;</button>
          <div class="m" id="calTitle"></div>
          <button class="small" id="nextM">&rsaquo;</button>
        </div>
        <div class="cal" id="calGrid"></div>
      </div>
      <div class="card">
        <div class="sub" style="font-size:14px;">体重の変化グラフ（その日の最終体重）</div>
        <svg id="graph" class="graph" viewBox="0 0 700 330" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="imgwrap">
        <div class="free-box" id="freeBox"><div class="free-ph">好きな画像</div></div>
        <button class="overbtn" id="btnFree">変更</button>
      </div>
    </div>

    <div class="btnrow">
      <button class="pink" id="btnToday">カレンダーで記録する</button>
      <button class="blue" id="btnRefresh">グラフを更新する</button>
    </div>
  </div>
</div>

<!-- ============ 記入ページ ============ -->
<div id="pageEntry" class="page">
  <h1><span class="dot"></span><span id="entryTitle"></span> の記録</h1>
  <div class="entry">

    <div class="mealcard">
      <div class="sub" style="font-size:19px;margin-bottom:10px;">食べたものの記録（時間は問いません）</div>
      <table class="meal">
        <thead><tr><th>食べたもの</th><th>カロリー</th><th></th><th></th></tr></thead>
        <tbody id="mealBody"></tbody>
      </table>
      <button class="small" id="btnAddMeal" style="margin-top:10px;align-self:flex-start;">＋ 食べたものを追加</button>
      <div class="total"><span>1日のカロリー合計</span><span><span class="num" id="kcalTotal">0</span> kcal</span></div>
    </div>

    <div>
      <div class="fight-box" id="fightBox"></div>
      <div class="sub" style="margin:14px 0 8px;">体重（はかった時だけでOK）</div>
      <div class="row3">
        <div class="wcell"><div class="lb">朝の体重</div><input type="number" step="0.1" id="wM" placeholder="00.0"></div>
        <div class="wcell"><div class="lb">昼の体重</div><input type="number" step="0.1" id="wN" placeholder="00.0"></div>
        <div class="wcell"><div class="lb">夜の体重</div><input type="number" step="0.1" id="wE" placeholder="00.0"></div>
      </div>
      <div class="sub mt14" style="font-size:15px;">いちばん後に入れた体重を、その日の記録としてグラフに使います。</div>
      <div class="mt14" style="display:flex;gap:14px;">
        <button class="pink" id="btnSave">保存してホームへ</button>
        <button id="btnCancel">キャンセル</button>
      </div>
      <div class="sub mt14" style="font-size:15px;">保存すると「あと ○○ kg」とグラフが自動で更新されます。</div>
    </div>

  </div>
</div>

<!-- ============ 記録一覧 ============ -->
<div id="pageList" class="page">
  <h1><span class="dot"></span>記録一覧</h1>
  <div class="card">
    <table class="list-tbl">
      <thead><tr><th>日付</th><th>朝</th><th>昼</th><th>夜</th><th>その日の体重</th><th>カロリー</th><th></th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
    <div class="mt14"><button id="btnBackHome">ホームへもどる</button></div>
  </div>
</div>

</div>

<div class="modal" id="goalModal">
  <div class="modal-in">
    <div class="ttl">目標の体重を入力してください</div>
    <div><input type="number" step="0.1" id="goalInput" placeholder="00.0"><span class="unit">kg</span></div>
    <div class="err" id="goalErr"></div>
    <div class="row">
      <button class="pink" id="goalOk">決定</button>
      <button id="goalCancel">キャンセル</button>
    </div>
  </div>
</div>

<div class="cheer" id="cheer">
  <div class="cheer-in">
    <div id="charCheer"></div>
    <div class="msg">がんばったね！</div>
  </div>
</div>

<input type="file" accept="image/*" class="hidden-file" id="fileIcon">
<input type="file" accept="image/*" class="hidden-file" id="fileFree">

var db={goal:null,icon:null,free:null,records:{}};

/* 16:9 のステージを画面サイズに合わせる */
function fitStage(){
  var s=Math.min(window.innerWidth/1600,window.innerHeight/900);
  document.getElementById('stage').style.transform='scale('+s+')';
}
window.addEventListener('resize',fitStage);

function load(){
  try{
    var s=localStorage.getItem(KEY);
    if(s){
      var d=JSON.parse(s);
      db.goal=(typeof d.goal==='number')?d.goal:null;
      db.icon=d.icon||null; db.free=d.free||null;
      db.records=d.records||{};
    }
  }catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){alert('保存できませんでした。画像のサイズが大きすぎるかもしれません。');}
}

function ymd(d){
  var m=d.getMonth()+1,dd=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
}
function jp(k){var p=k.split('-');return Number(p[0])+'年'+Number(p[1])+'月'+Number(p[2])+'日';}
function jpShort(k){var p=k.split('-');return Number(p[1])+'/'+Number(p[2]);}
function r1(n){return Math.round(n*10)/10;}
function dayWeight(rec){
  if(!rec)return null;
  if(rec.e!=null)return rec.e;
  if(rec.n!=null)return rec.n;
  if(rec.m!=null)return rec.m;
  return null;
}
function datesWithWeight(){
  return Object.keys(db.records).filter(function(k){return dayWeight(db.records[k])!=null;}).sort();
}

function show(id){
  ['pageHome','pageEntry','pageList'].forEach(function(p){
    document.getElementById(p).classList.toggle('active',p===id);
  });
}

function renderHome(){
  document.getElementById('goalTxt').textContent = db.goal!=null ? r1(db.goal).toFixed(1) : '○○';
  var box=document.getElementById('iconBox');
  box.innerHTML = db.icon ? '<img src="'+db.icon+'" alt="アイコン画像">' : '<div class="icon-ph">アイコン<br>画像</div>';
  var fb=document.getElementById('freeBox');
  fb.innerHTML = db.free ? '<img src="'+db.free+'" alt="好きな画像">' : '<div class="free-ph">好きな画像</div>';

  var ds=datesWithWeight();
  var last=ds.length?ds[ds.length-1]:null;
  var lw=last?dayWeight(db.records[last]):null;
  if(lw==null){
    document.getElementById('remainTxt').textContent='○○';
    document.getElementById('lastTxt').textContent='まだ記録がありません';
  }else if(db.goal==null){
    document.getElementById('remainTxt').textContent='○○';
    document.getElementById('lastTxt').textContent='最終体重 '+r1(lw).toFixed(1)+'kg（'+jp(last)+'）／目標を入れると計算されます';
  }else{
    var rem=r1(lw-db.goal);
    document.getElementById('remainTxt').textContent = rem>0 ? rem.toFixed(1) : '0.0';
    document.getElementById('lastTxt').textContent =
      '最終体重 '+r1(lw).toFixed(1)+'kg（'+jp(last)+'）'+(rem<=0?'　目標達成！':'');
  }
  renderGraph();
  renderCal();
}

function renderGraph(){
  var g=document.getElementById('graph');
  g.innerHTML='';
  var ds=datesWithWeight().slice(-10);
  var W=700,H=330,L=58,R=20,T=22,B=46;
  function el(n,a){
    var e=document.createElementNS('http://www.w3.org/2000/svg',n);
    for(var k in a)e.setAttribute(k,a[k]);
    return e;
  }
  if(ds.length===0){
    var t=el('text',{x:W/2,y:H/2,'text-anchor':'middle','class':'glabel'});
    t.textContent='記録をすると、ここにグラフが出ます';
    g.appendChild(t);
    return;
  }
  var vals=ds.map(function(k){return dayWeight(db.records[k]);});
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(db.goal!=null){mn=Math.min(mn,db.goal);mx=Math.max(mx,db.goal);}
  if(mx-mn<1){mn-=0.5;mx+=0.5;}
  var pad=(mx-mn)*0.15; mn-=pad; mx+=pad;
  function X(i){return ds.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(ds.length-1);}
  function Y(v){return T+(mx-v)*(H-T-B)/(mx-mn);}
  for(var i=0;i<=4;i++){
    var v=mn+(mx-mn)*i/4,y=Y(v);
    g.appendChild(el('line',{x1:L,y1:y,x2:W-R,y2:y,'class':'ggrid'}));
    var lb=el('text',{x:L-8,y:y+4,'text-anchor':'end','class':'glabel'});
    lb.textContent=v.toFixed(1);
    g.appendChild(lb);
  }
  if(db.goal!=null&&db.goal>=mn&&db.goal<=mx){
    g.appendChild(el('line',{x1:L,y1:Y(db.goal),x2:W-R,y2:Y(db.goal),
      stroke:'#e0607e','stroke-width':1.5,'stroke-dasharray':'6 5'}));
    var gt=el('text',{x:W-R,y:Y(db.goal)-6,'text-anchor':'end','class':'glabel',fill:'#e0607e'});
    gt.textContent='目標 '+r1(db.goal).toFixed(1)+'kg';
    g.appendChild(gt);
  }
  if(ds.length>1){
    g.appendChild(el('polyline',{points:ds.map(function(k,i){return X(i)+','+Y(vals[i]);}).join(' '),'class':'gline'}));
  }
  ds.forEach(function(k,i){
    g.appendChild(el('circle',{cx:X(i),cy:Y(vals[i]),r:(i===ds.length-1?7:5),
      'class':(i===ds.length-1?'glast':'gdot')}));
    var xl=el('text',{x:X(i),y:H-18,'text-anchor':'middle','class':'glabel'});
    xl.textContent=jpShort(k);
    g.appendChild(xl);
    var vl=el('text',{x:X(i),y:Y(vals[i])-14,'text-anchor':'middle','class':'glabel'});
    vl.textContent=r1(vals[i]).toFixed(1);
    g.appendChild(vl);
  });
}

var calY,calM;
function renderCal(){
  document.getElementById('calTitle').textContent=calY+'年'+(calM+1)+'月';
  var grid=document.getElementById('calGrid');
  grid.innerHTML='';
  ['日','月','火','水','木','金','土'].forEach(function(w,i){
    var e=document.createElement('div');
    e.className='w'+(i===0?' sun':'');
    e.textContent=w;
    grid.appendChild(e);
  });
  var first=new Date(calY,calM,1).getDay();
  var days=new Date(calY,calM+1,0).getDate();
  var todayKey=ymd(new Date());
  for(var i=0;i<first;i++){
    var sp=document.createElement('div'); sp.className='d empty'; grid.appendChild(sp);
  }
  for(var d=1;d<=days;d++){
    var key=ymd(new Date(calY,calM,d));
    var e=document.createElement('div');
    e.className='d'+(((first+d-1)%7===0)?' sun':'')+(db.records[key]?' has':'')+(key===todayKey?' today':'');
    e.textContent=d;
    e.setAttribute('data-key',key);
    e.addEventListener('click',function(){openEntry(this.getAttribute('data-key'));});
    grid.appendChild(e);
  }
}

var editKey=null;
function mealRow(name,kcal){
  var tb=document.getElementById('mealBody');
  var tr=document.createElement('tr');
  var td1=document.createElement('td');
  var i1=document.createElement('input');
  i1.type='text'; i1.className='mname uline'; i1.value=name||'';
  td1.appendChild(i1);
  var td2=document.createElement('td'); td2.className='k';
  var i2=document.createElement('input');
  i2.type='number'; i2.className='mkcal uline'; i2.value=(kcal==null?'':kcal);
  i2.addEventListener('input',calcTotal);
  td2.appendChild(i2);
  var td3=document.createElement('td'); td3.className='u'; td3.textContent='kcal';
  var td4=document.createElement('td'); td4.className='x';
  var b=document.createElement('button'); b.className='small'; b.textContent='×';
  b.addEventListener('click',function(){tr.parentNode.removeChild(tr);calcTotal();});
  td4.appendChild(b);
  tr.appendChild(td1);tr.appendChild(td2);tr.appendChild(td3);tr.appendChild(td4);
  tb.appendChild(tr);
}
function calcTotal(){
  var t=0;
  Array.prototype.forEach.call(document.querySelectorAll('.mkcal'),function(i){
    var v=parseFloat(i.value); if(!isNaN(v))t+=v;
  });
  document.getElementById('kcalTotal').textContent=Math.round(t).toLocaleString();
}
function renderFight(){
  var box=document.getElementById('fightBox');
  box.innerHTML='<img src="'+IMG_GANBAROU+'" alt="がんばろう">';
}
function openEntry(key){
  editKey=key;
  document.getElementById('entryTitle').textContent=jp(key);
  var r=db.records[key]||{};
  document.getElementById('wM').value=(r.m==null?'':r.m);
  document.getElementById('wN').value=(r.n==null?'':r.n);
  document.getElementById('wE').value=(r.e==null?'':r.e);
  document.getElementById('mealBody').innerHTML='';
  var meals=(r.meals&&r.meals.length)?r.meals:[];
  meals.forEach(function(m){mealRow(m.name,m.kcal);});
  while(document.getElementById('mealBody').children.length<8){mealRow('',null);}
  calcTotal();
  renderFight();
  show('pageEntry');
}
function num(id){
  var v=parseFloat(document.getElementById(id).value);
  return isNaN(v)?null:r1(v);
}
function doSave(){
  var m=num('wM'),n=num('wN'),e=num('wE');
  var meals=[];
  Array.prototype.forEach.call(document.querySelectorAll('#mealBody tr'),function(tr){
    var nm=tr.querySelector('.mname').value.replace(/^\s+|\s+$/g,'');
    var kc=parseFloat(tr.querySelector('.mkcal').value);
    if(nm||!isNaN(kc))meals.push({name:nm,kcal:isNaN(kc)?null:Math.round(kc)});
  });
  if(m==null&&n==null&&e==null&&meals.length===0){delete db.records[editKey];}
  else{db.records[editKey]={m:m,n:n,e:e,meals:meals};}
  save();
  renderHome();
  show('pageHome');
  if(m!=null||n!=null||e!=null)cheer();
}
function cheer(){
  var c=document.getElementById('cheer');
  document.getElementById('charCheer').innerHTML=
    '<img src="'+IMG_FIGHT+'" alt="ファイト" class="waving imgwave">';
  c.classList.add('show');
  setTimeout(function(){c.classList.remove('show');},2800);
}
function renderList(){
  var tb=document.getElementById('listBody');
  tb.innerHTML='';
  var keys=Object.keys(db.records).sort().reverse();
  if(!keys.length){
    var tr0=document.createElement('tr');
    var td0=document.createElement('td');
    td0.colSpan=7; td0.textContent='まだ記録がありません'; td0.style.color='#8d8480';
    tr0.appendChild(td0); tb.appendChild(tr0);
    return;
  }
  keys.forEach(function(k){
    var r=db.records[k],dw=dayWeight(r);
    var kc=0;
    (r.meals||[]).forEach(function(x){if(x.kcal)kc+=x.kcal;});
    var tr=document.createElement('tr');
    function td(txt){var e=document.createElement('td');e.textContent=txt;tr.appendChild(e);}
    td(jp(k));
    td(r.m==null?'-':r.m.toFixed(1));
    td(r.n==null?'-':r.n.toFixed(1));
    td(r.e==null?'-':r.e.toFixed(1));
    td(dw==null?'-':dw.toFixed(1)+' kg');
    td(kc?kc.toLocaleString()+' kcal':'-');
    var last=document.createElement('td');
    var b=document.createElement('button');
    b.className='small'; b.textContent='編集';
    b.addEventListener('click',function(){openEntry(k);});
    last.appendChild(b);
    tr.appendChild(last);
    tb.appendChild(tr);
  });
}

function readImage(file,cb){
  if(!file)return;
  if(file.size>4*1024*1024){alert('画像が大きすぎます（4MBまで）。小さいものを選んでください。');return;}
  var fr=new FileReader();
  fr.onload=function(){resize(fr.result,cb);};
  fr.readAsDataURL(file);
}
function resize(dataUrl,cb){
  var img=new Image();
  img.onload=function(){
    var max=700,w=img.width,h=img.height;
    var s=Math.min(1,max/Math.max(w,h));
    var cv=document.createElement('canvas');
    cv.width=Math.round(w*s); cv.height=Math.round(h*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cb(cv.toDataURL('image/png'));
  };
  img.onerror=function(){cb(dataUrl);};
  img.src=dataUrl;
}

function openGoal(){
  document.getElementById('goalInput').value=(db.goal!=null?db.goal:'');
  document.getElementById('goalErr').textContent='';
  document.getElementById('goalModal').classList.add('show');
  setTimeout(function(){document.getElementById('goalInput').focus();},30);
}
function closeGoal(){document.getElementById('goalModal').classList.remove('show');}
function applyGoal(){
  var v=document.getElementById('goalInput').value.replace(/^\s+|\s+$/g,'');
  var n=parseFloat(v);
  if(v===''||isNaN(n)||n<=0||n>300){
    document.getElementById('goalErr').textContent='数字で入力してください（例 50）';
    return;
  }
  db.goal=r1(n); save(); renderHome(); closeGoal();
}
document.getElementById('btnGoal').addEventListener('click',openGoal);
document.getElementById('goalOk').addEventListener('click',applyGoal);
document.getElementById('goalCancel').addEventListener('click',closeGoal);
document.getElementById('goalInput').addEventListener('keydown',function(e){
  if(e.key==='Enter')applyGoal();
  if(e.key==='Escape')closeGoal();
});
document.getElementById('goalModal').addEventListener('click',function(e){
  if(e.target===this)closeGoal();
});
